<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<!-- エラーメッセージ -->
	<th:block th:if="${not #strings.isEmpty(error)}" id="error">
		<ul style="padding-left: 0; list-style: none;">
			<li><span th:utext="'*' + '&nbsp' + ${error}" class="help-inline error"></span></li>
		</ul>
	</th:block>



	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" th:object="${attendanceForm}" method="post">
				<table class="table table-hover dataTable no-footer">
					<thead>
						<tr>
							<th class="w140">日付</th>
							<th class="w140">コース内容</th>
							<th class="w60"></th>
							<th class="w180" colspan="3">出勤</th>
							<th class="w180" colspan="3">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w140">備考</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|"
										th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|"
										th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|"
										th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|"
										th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|"
										th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|"
										th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w140">[[${dailyAttendanceForm.sectionName}]]</td>
								<td class="w60"><input type="button" class="btn btn-info update-button" value="定時" th:onclick="|setRegularhours(${stat.index});|"></td>
								<!-- 出勤（時）のセレクトボックス -->
								<td class="w70">
									<select 
										th:id="|dispStartHour__${stat.index}__|"
										class="form-control"
										th:field="*{attendanceList[__${stat.index}__].dispStartHour}"
										th:errorclass="has-error">
										<option th:each="hour : *{hourMap}" th:value="${hour.key}"
											th:text="${hour.value}" >
										</option>
									</select>
								</td>
								<td>:</td>
								<td>
									<select 
										th:id="|dispStartMinute__${stat.index}__|"
										class="form-control"
										th:field="*{attendanceList[__${stat.index}__].dispStartMinute}"
										th:errorclass="has-error"
										>
										<option th:each="minute : *{minuteMap}" th:value="${minute.key}"
											th:text="${minute.value}">
										</option>
									</select>
								</td>

								<td>
									<select 
										th:id="|dispEndHour__${stat.index}__|" 
										class="form-control"
										th:field="*{attendanceList[__${stat.index}__].dispEndHour}"
										th:errorclass="has-error">
										<option th:each="hour : *{hourMap}" th:value="${hour.key}"
											th:text="${hour.value}"></option>
									</select>
								</td>
								<td>:</td>
								<td>
									<select 
										th:id="|dispEndMinute__${stat.index}__|" 
										class="form-control"
										th:field="*{attendanceList[__${stat.index}__].dispEndMinute}"
										th:errorclass="has-error">
										<option th:each="minute : *{minuteMap}" th:value="${minute.key}"
											th:text="${minute.value}"></option>
									</select>
								</td>

								<td>
									<select class="form-control" 
										th:field="*{attendanceList[__${stat.index}__].blankTime}"
										th:errorclass="has-error"
									>
										<option th:each="blankTime : *{blankTimes}" th:value="${blankTime.key}"
											th:text="${blankTime.value}"></option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w140">
									<input type="text" th:name="|attendanceList[${stat.index}].note|"
										th:value="${dailyAttendanceForm.note}" class="form-control" th:errorclass="has-error"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>



				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" onclick="return registCheck();" />
				</div>
				

			</form>
			
		</div>
	</div>








	<script>
		function registCheck() {
			if (confirm("更新します。よろしいですか？")) {
				return true;
			}
			else {
				return false;
			}
		}
		
		function setRegularhours(index){
			const startHourTarget = document.getElementById("dispStartHour"+index);
			const startMinuteTarget = document.getElementById("dispStartMinute"+index);
			const endHourTarget = document.getElementById("dispEndHour"+index);
			const endMinuteTarget = document.getElementById("dispEndMinute"+index);
			
			startHourTarget.value = "9";
			startMinuteTarget.value = "0";
			endHourTarget.value = "18";
			endMinuteTarget.value = "0";
		}
	</script>
	<style>
		
		
		.has-error.form-control {
			border-color: #b94a48;
			-webkit-box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075);
			box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075);
			color: #b94a48;
			border-color: #b94a48;
			background-color: #f2dede;
		}
		
		.has-error.form-control:focus {
			border-color: #953b39;
			-webkit-box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075), 0 0 6px
				#d59392;
			box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075), 0 0 6px #d59392;
			
		}
	</style>
</body>

</html>
